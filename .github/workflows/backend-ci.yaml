name: Build, Push and Deploy Backend
on:
    push:
        branches: [ main ]
        paths:
            - "worker/**"
            - "k8s/backend/**"
            - "k8s/database/**"
            - "k8s/namespace.yaml"

permissions:
  contents: write

env:
    DEPLOY_BRANCH: production
    MANIFEST_ROOT: k8s/backend
    DB_MANIFEST_ROOT: k8s/database

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  registry: docker.io
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./worker
                  file: ./worker/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/votingapp:worker-latest
                  cache-from: type=gha,scope=worker
                  cache-to: type=gha,mode=max,scope=worker

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        if: github.actor != 'github-actions[bot]'
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        steps:
            - name: Checkout source branch
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Checkout or create deploy branch
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  if git ls-remote --exit-code --heads origin "${{ env.DEPLOY_BRANCH }}" >/dev/null 2>&1; then
                    git fetch origin "${{ env.DEPLOY_BRANCH }}"
                    git checkout -B "${{ env.DEPLOY_BRANCH }}" "origin/${{ env.DEPLOY_BRANCH }}"
                  else
                    echo "Deploy branch '${{ env.DEPLOY_BRANCH }}' does not exist yet, creating it from ${{ github.ref_name }}"
                    git checkout -B "${{ env.DEPLOY_BRANCH }}"
                  fi

            - name: Sync YAML manifests from source branch
              run: |
                  set -euo pipefail
                  SOURCE_BRANCH="${{ github.ref_name }}"

                  git fetch --no-tags --depth=1 origin "${SOURCE_BRANCH}"

                  for ROOT in "${{ env.MANIFEST_ROOT }}" "${{ env.DB_MANIFEST_ROOT }}"; do
                    echo "Syncing manifests under ${ROOT}"
                    mkdir -p "${ROOT}"
                    git checkout "origin/${SOURCE_BRANCH}" -- "${ROOT}"

                    git ls-tree -r --name-only HEAD -- "${ROOT}" | grep -E '\.ya?ml$' | sort > /tmp/deploy_yamls.txt || true
                    git ls-tree -r --name-only "origin/${SOURCE_BRANCH}" -- "${ROOT}" | grep -E '\.ya?ml$' | sort > /tmp/source_yamls.txt || true

                    while IFS= read -r file; do
                      [ -z "$file" ] && continue
                      git rm -f "$file"
                    done < <(comm -23 /tmp/deploy_yamls.txt /tmp/source_yamls.txt)
                  done

                  echo "Syncing k8s/namespace.yaml"
                  git checkout "origin/${SOURCE_BRANCH}" -- "k8s/namespace.yaml"

            - name: Update deployment image tag in deploy branch
              run: |
                  set -e
                  IMAGE="${{ secrets.DOCKER_USERNAME }}/votingapp:worker-latest"

                  echo "Updating ${{ env.MANIFEST_ROOT }}/worker-deployment.yaml to ${IMAGE}"
                  sed -i "s|image: .*|image: ${IMAGE}|g" "${{ env.MANIFEST_ROOT }}/worker-deployment.yaml"

                  echo "Resulting image line:"
                  grep 'image:' "${{ env.MANIFEST_ROOT }}/worker-deployment.yaml" || true

            - name: Commit and push changes to deploy branch
              run: |
                  set -e
                  git add "${{ env.MANIFEST_ROOT }}" "${{ env.DB_MANIFEST_ROOT }}" "k8s/namespace.yaml"

                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "Update backend deployment image to $(echo ${{ github.sha }} | cut -c1-7)"
                    git push origin "${{ env.DEPLOY_BRANCH }}"
                  fi
